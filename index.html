<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>부부묵상 365</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&family=Frank+Ruhl+Libre:wght@500;700&display=swap');
    
    :root {
      --app-base-size: 16px; /* 기본 글자 크기 16px */
    }

    body { 
      font-family: 'Noto Sans KR', sans-serif; 
      font-size: var(--app-base-size);
    }
    
    .scripture-font { font-family: 'Noto Serif KR', serif; line-height: 1.85; }
    .hebrew-text { font-family: 'Frank Ruhl Libre', serif; direction: rtl; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .dynamic-root {
      font-size: var(--app-base-size);
    }

    /* 본문 및 모달 내부 표(Table) 서식 자동 지원 */
    #modal-content table, .tab-panel table {
      width: 100%;
      border-collapse: collapse;
      margin: 12px 0;
      font-size: 0.95em;
    }
    #modal-content th, #modal-content td, .tab-panel th, .tab-panel td {
      border: 1px solid #cbd5e1;
      padding: 8px 10px;
    }
    #modal-content th, .tab-panel th {
      background-color: #f1f5f9;
      font-weight: 700;
    }
    #modal-content h2, .tab-panel h2 {
      font-size: 1.25em;
      font-weight: 700;
      color: #1e1b4b;
      margin-bottom: 8px;
    }
    #modal-content h3, .tab-panel h3 {
      font-size: 1.1em;
      font-weight: 700;
      color: #312e81;
      margin-bottom: 6px;
    }

    /* 요일별 카드 미리보기에서만 h1(장 제목) 숨김 처리 (모달 팝업 전문에서는 정상 노출) */
    #daily-reading-card h1 {
      display: none !important;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 flex justify-center min-h-screen">

  <div class="dynamic-root w-full max-w-3xl bg-white min-h-screen flex flex-col shadow-xl relative">

    <!-- 상단 헤더 -->
    <header class="bg-indigo-950 text-white px-4 sm:px-6 py-3 sticky top-0 z-30 shadow-md">
      <!-- 1층: 서비스명 좌측, 폰트 조절 우측 -->
      <div class="flex items-center justify-between mb-2">
        <div class="flex items-center space-x-2">
          <i data-lucide="book-open" class="w-5 h-5 text-amber-400"></i>
          <span class="text-[1.05em] tracking-wider text-white font-bold">부부묵상 365</span>
        </div>
        
<!-- 👇 수정 후 (주변보다 3단계 옅고 화사한 톤: bg-indigo-700/60 또는 bg-indigo-600/70) -->
       <div class="flex items-center space-x-1 bg-indigo-600/60 rounded-lg px-2 py-0.5 border border-indigo-400/40 shadow-inner">
         <button id="btn-font-dec" class="text-[0.75em] text-indigo-100 hover:text-white px-1.5 py-0.5 transition-colors">가-</button>
         <span class="text-[0.7em] text-indigo-300/70">|</span>
         <button id="btn-font-inc" class="text-[0.75em] text-indigo-100 hover:text-white px-1.5 py-0.5 font-bold transition-colors">가+</button>
       </div>
      </div>

      <!-- 2층: 포션 선택 박스 -->
      <div class="flex items-center justify-between bg-indigo-900/40 rounded-xl p-2 sm:p-3 border border-indigo-800/80">
        <button onclick="prevWeek()" class="p-1 hover:bg-indigo-800 rounded-lg text-indigo-300 active:scale-95 transition-all">
          <i data-lucide="chevron-left" class="w-5 h-5"></i>
        </button>
        <div class="text-center flex-1 px-2">
          <div id="header-date" class="text-[0.75em] text-amber-300 font-semibold tracking-wide">오늘의 말씀 확인 중...</div>
          <div class="flex items-center justify-center space-x-2">
            <h1 id="header-title" class="text-[1.1em] font-bold text-white">토라포션 불러오는 중</h1>
            <span id="header-hebrew" class="hebrew-text text-[1.2em] text-amber-200"></span>
          </div>
        </div>
        <button onclick="nextWeek()" class="p-1 hover:bg-indigo-800 rounded-lg text-indigo-300 active:scale-95 transition-all">
          <i data-lucide="chevron-right" class="w-5 h-5"></i>
        </button>
      </div>
    </header>   

    <!-- 스크롤 탭 바 -->
    <nav class="bg-white border-b border-slate-200 sticky top-[108px] z-20 flex overflow-x-auto no-scrollbar px-3 sm:px-6 py-2 shadow-sm gap-2">
      <button onclick="switchTab('reading')" id="tab-reading" class="tab-btn active flex-shrink-0 px-4 py-1.5 rounded-full text-[0.85em] font-semibold transition-all bg-indigo-900 text-white">
        리딩 본문 (일~토)
      </button>
      <button onclick="switchTab('exegesis')" id="tab-exegesis" class="tab-btn flex-shrink-0 px-4 py-1.5 rounded-full text-[0.85em] font-semibold transition-all bg-slate-100 text-slate-600 hover:bg-slate-200">
        핵심 강해
      </button>
      <button onclick="switchTab('symbols')" id="tab-symbols" class="tab-btn flex-shrink-0 px-4 py-1.5 rounded-full text-[0.85em] font-semibold transition-all bg-slate-100 text-slate-600 hover:bg-slate-200">
        상징 & 묵상
      </button>
      <button onclick="switchTab('dictionary')" id="tab-dictionary" class="tab-btn flex-shrink-0 px-4 py-1.5 rounded-full text-[0.85em] font-semibold transition-all bg-slate-100 text-slate-600 hover:bg-slate-200">
        원어 묵상
      </button>
    </nav>

    <!-- 메인 콘텐츠 영역 -->
    <main id="content-body" class="flex-1 p-4 sm:p-6 pb-28 overflow-y-auto space-y-4">

      <!-- ================= TAB 1: 리딩 본문 (일~토 7일) ================= -->
      <section id="panel-reading" class="tab-panel space-y-4">
        
        <div class="bg-amber-50/70 border border-amber-200/80 rounded-2xl p-4 sm:p-5">
          <div class="flex items-center justify-between text-amber-900 font-bold mb-3">
            <div class="flex items-center space-x-2">
              <i data-lucide="calendar" class="w-4 h-4 text-amber-600"></i>
              <span class="text-[0.95em]">이번 주 성경 읽기 (일~토 7일 리딩)</span>
            </div>
            <span class="text-[0.75em] font-normal text-amber-700 bg-amber-200/60 px-2 py-0.5 rounded-full">매일 읽기</span>
          </div>

          <!-- 일~토 요일 선택 탭 -->
          <div class="grid grid-cols-7 gap-1 sm:gap-1.5 mb-4">
            <button onclick="selectReadingDay(0)" class="daily-tab-btn py-2 rounded-xl text-[0.8em] font-semibold border transition-all text-center">일</button>
            <button onclick="selectReadingDay(1)" class="daily-tab-btn py-2 rounded-xl text-[0.8em] font-semibold border transition-all text-center">월</button>
            <button onclick="selectReadingDay(2)" class="daily-tab-btn py-2 rounded-xl text-[0.8em] font-semibold border transition-all text-center">화</button>
            <button onclick="selectReadingDay(3)" class="daily-tab-btn py-2 rounded-xl text-[0.8em] font-semibold border transition-all text-center">수</button>
            <button onclick="selectReadingDay(4)" class="daily-tab-btn py-2 rounded-xl text-[0.8em] font-semibold border transition-all text-center">목</button>
            <button onclick="selectReadingDay(5)" class="daily-tab-btn py-2 rounded-xl text-[0.8em] font-semibold border transition-all text-center">금</button>
            <button onclick="selectReadingDay(6)" class="daily-tab-btn py-2 rounded-xl text-[0.8em] font-semibold border transition-all text-center">토</button>
          </div>

          <!-- 선택된 요일 카드 본문 영역 -->
          <div id="daily-reading-card" class="space-y-3">
            <div class="text-center py-6 text-slate-400 text-[0.85em]">데이터를 불러오고 있습니다...</div>
          </div>
        </div>

        <!-- 주간 전체 포션 요약 카드 -->
        <div class="bg-slate-50 border border-slate-200 rounded-2xl p-4">
          <div class="text-[0.8em] font-bold text-slate-600 mb-2 flex items-center gap-1.5">
            <i data-lucide="scroll" class="w-3.5 h-3.5 text-slate-500"></i>
            <span>주간전체 성경 범위요약(개정개역성경은 책에서 참고하세요)</span>
          </div>
          <div id="weekly-overview-list" class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-[0.8em]">
          </div>
        </div>
      </section>

      <!-- ================= TAB 2: 핵심 강해 ================= -->
      <section id="panel-exegesis" class="tab-panel hidden space-y-3">
        <div id="exegesis-content" class="bg-white border border-slate-200 rounded-2xl p-4 sm:p-5 shadow-sm text-[0.9em] leading-relaxed space-y-2">
        </div>
      </section>

      <!-- ================= TAB 3: 상징 & 묵상 ================= -->
      <section id="panel-symbols" class="tab-panel hidden space-y-3">
        <div id="symbols-content" class="bg-white border border-slate-200 rounded-2xl p-4 sm:p-5 shadow-sm text-[0.9em] leading-relaxed space-y-2">
        </div>
      </section>

      <!-- ================= TAB 4: 원어 묵상 (O열) ================= -->
      <section id="panel-dictionary" class="tab-panel hidden space-y-3">
        <div id="dictionary-content" class="bg-white border border-slate-200 rounded-2xl p-4 sm:p-5 shadow-sm text-[0.9em] leading-relaxed space-y-2">
        </div>
      </section>

      <!-- 하단 고정 버튼 높이만큼의 안전 여백 블록 -->
      <div class="w-full h-28 flex-shrink-0" aria-hidden="true"></div>

    </main>

    <!-- ================= 성경 전문 및 모달 ================= -->
    <div id="scripture-modal" class="fixed inset-0 z-50 bg-black/60 hidden flex flex-col justify-end items-center">
      <div class="flex-1 w-full" onclick="closeScriptureModal()"></div>
      <div class="bg-white w-full max-w-3xl rounded-t-3xl h-[85vh] flex flex-col shadow-2xl overflow-hidden animate-in slide-in-from-bottom duration-300">
        <div class="p-4 border-b border-slate-200 flex items-center justify-between bg-slate-50">
          <div>
            <span id="modal-category" class="text-[0.75em] font-bold text-indigo-700 bg-indigo-100 px-2 py-0.5 rounded-full">본문 읽기</span>
            <h3 id="modal-title" class="font-bold text-slate-900 text-[1.05em] mt-1">제목</h3>
          </div>
          <button onclick="closeScriptureModal()" class="p-2 hover:bg-slate-200 rounded-full text-slate-500">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>
        <div id="modal-content" class="flex-1 p-5 overflow-y-auto text-slate-800 space-y-4 text-[0.95em] leading-relaxed" style="font-family: 'Noto Sans KR', sans-serif;">
        </div>
        <div class="p-3 border-t border-slate-100 bg-slate-50 text-center">
          <button onclick="closeScriptureModal()" class="w-full bg-indigo-950 text-white font-semibold py-2.5 rounded-xl text-[0.85em] hover:bg-indigo-900 transition-all">
            본문 닫기 (읽기 완료)
          </button>
        </div>
      </div>
    </div>

    <!-- 하단 액션바 -->
    <footer class="bg-white/95 backdrop-blur-sm border-t border-slate-200 p-3 fixed bottom-0 left-0 right-0 max-w-3xl mx-auto flex items-center justify-between z-30 shadow-lg">
      <button class="flex items-center space-x-1.5 text-[0.8em] text-slate-600 hover:text-indigo-900 font-medium px-3 py-2 rounded-xl hover:bg-slate-100">
        <i data-lucide="edit-3" class="w-4 h-4"></i>
        <span>묵상 메모</span>
      </button>

      <!-- 카피라이트 (회색, 0.7em, 기울임꼴) -->
      <span class="text-slate-400 text-[0.7em] italic select-none">
        CopyRight-Free 2026
      </span>

      <button onclick="sharePortion()" class="bg-indigo-900 text-white text-[0.8em] font-semibold px-4 py-2 rounded-xl flex items-center space-x-1.5 shadow-sm active:scale-95 transition-all">
        <i data-lucide="share-2" class="w-4 h-4"></i>
        <span>포션 나눔</span>
      </button>
    </footer>

  </div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyixC3pyDsX4WXrJijIfecl2huUIzC-XQ7Cvv01xiroQu4Q-Dt30AMgGgNGxpxhnG7_/exec";

    let currentIndex = 1;     // 시트 내 현재 행 순번 (1 ~ totalCount)
    let totalCount = 1;       // 시트 내 전체 데이터 행 개수
    let sessionCache = {};    // 이번 세션에서 불러온 인덱스 저장소 (초고속 재열람)
    let currentWeekData = null;
    let selectedDayIndex = 0; // 0:일 ~ 6:토

    const DAY_NAMES = [
      "일요일 (1일차)", 
      "월요일 (2일차)", 
      "화요일 (3일차)", 
      "수요일 (4일차)", 
      "목요일 (5일차)", 
      "금요일 (6일차)", 
      "토요일 (7일차)"
    ];

    function cleanText(txt) {
      if (!txt) return '';
      return String(txt).replace(/^\s+/, '').trim();
    }

    // 접속 당일의 양력 날짜(YYYY-MM-DD) 구하기
    function getTodayYMD() {
      const now = new Date();
      const y = now.getFullYear();
      const m = ('0' + (now.getMonth() + 1)).slice(-2);
      const d = ('0' + now.getDate()).slice(-2);
      return `${y}-${m}-${d}`;
    }

    // HTML 태그 감지 및 렌더링 함수
    function setModalBody(rawText) {
      const modalContent = document.getElementById('modal-content');
      const text = cleanText(rawText);

      modalContent.style.fontFamily = "'Noto Sans KR', sans-serif";

      if (/<[a-z][\s\S]*>/i.test(text)) {
        modalContent.className = "flex-1 p-5 overflow-y-auto text-slate-800 space-y-4 text-[0.95em] leading-relaxed";
        modalContent.innerHTML = text;
      } else {
        modalContent.className = "flex-1 p-5 overflow-y-auto text-slate-800 space-y-4 text-[0.95em] leading-relaxed whitespace-pre-line";
        modalContent.innerText = text;
      }
      modalContent.scrollTop = 0;
    }

    // 데이터 호출 (오늘 날짜 today 또는 특정 index 번호)
    async function fetchWeekData(param) {
      // 1. 이미 이번 세션에서 읽어온 주차면 통신 없이 0.01초 즉시 표시
      if (param.index && sessionCache[param.index]) {
        const cached = sessionCache[param.index];
        currentIndex = cached.currentIndex;
        totalCount = cached.totalCount;
        currentWeekData = cached.data;
        renderCurrentWeek();
        return;
      }

      // 2. 통신 진행 표시
      document.getElementById('header-title').innerText = "포션 불러오는 중...";
      document.getElementById('header-date').innerText = '데이터 동기화 중';

      let queryString = '';
      if (param.today) queryString = `today=${param.today}`;
      else if (param.index) queryString = `index=${param.index}`;
      else if (param.week) queryString = `week=${encodeURIComponent(param.week)}`;

      try {
        const fetchUrl = `${GAS_API_URL}?${queryString}&_t=${Date.now()}`;
        const response = await fetch(fetchUrl);
        const result = await response.json();

        if (result && result.data) {
          currentIndex = result.currentIndex;
          totalCount = result.totalCount;
          currentWeekData = result.data;
          
          // 세션 메모리에 보관
          sessionCache[currentIndex] = result;

          renderCurrentWeek();
        } else {
          throw new Error("데이터 구조 오류");
        }
      } catch (error) {
        console.error("데이터 동기화 실패:", error);
        document.getElementById('header-title').innerText = "연결 실패";
        document.getElementById('header-date').innerText = "다시 시도해 주세요";
      }
    }

    function renderCurrentWeek() {
      const data = currentWeekData;
      if (!data) return;

      // 주차 라벨 자동 서식 (숫자면 [N주차], 문자면 [초막절] 등)
      const weekVal = data.week || '';
      const weekDisplay = String(weekVal).includes('주') || isNaN(weekVal) ? `[${weekVal}]` : `[${weekVal}주차]`;

      const dateDisplay = data.date_info ? `${data.date_info} (${data.season || ''})` : (data.start_date ? `${data.start_date} ~ ${data.end_date}` : '');
      document.getElementById('header-date').innerText = dateDisplay;
      document.getElementById('header-title').innerText = `${weekDisplay} ${data.title_ko || ''}`;
      document.getElementById('header-hebrew').innerText = data.title_he || '';

      updateDailyReadingView();

      // 이야기 데이터 (L열: special_ref)
      const storyRaw = data.special_ref || data.special_text || data.special || '';
      const cleanStoryPreview = storyRaw.replace(/<[^>]*>?/gm, '').trim();
      const storyPreview = cleanStoryPreview ? (cleanStoryPreview.length > 25 ? cleanStoryPreview.substring(0, 25) + '...' : cleanStoryPreview) : '이야기 읽기';

      // 하프타라 & 브릿하다샤
      const haftarahRef = data.haftarah_ref || '-';
      const britRef = data.brit_ref || '-';

      document.getElementById('weekly-overview-list').innerHTML = `
        <div onclick="openTorahModal()" class="bg-white p-2.5 rounded-lg border border-slate-200 hover:border-indigo-400 hover:bg-indigo-50/30 cursor-pointer transition-all shadow-sm group">
          <div class="flex items-center justify-between">
            <span class="font-bold text-indigo-950 block group-hover:text-indigo-900">토라 (파라샤)</span>
            <span class="text-[0.7em] text-indigo-700 bg-indigo-50 font-semibold px-1.5 py-0.5 rounded flex items-center gap-0.5">
              <span>전문</span>
              <i data-lucide="chevron-right" class="w-3 h-3"></i>
            </span>
          </div>
          <span class="text-slate-600 truncate block mt-0.5 text-[0.85em]">${data.torah_ref || '-'}</span>
        </div>

        <div onclick="openHaftarahModal()" class="bg-white p-2.5 rounded-lg border border-slate-200 hover:border-indigo-400 hover:bg-indigo-50/30 cursor-pointer transition-all shadow-sm group">
          <div class="flex items-center justify-between">
            <span class="font-bold text-indigo-950 block group-hover:text-indigo-900">하프타라 (선지서)</span>
            <span class="text-[0.7em] text-indigo-700 bg-indigo-50 font-semibold px-1.5 py-0.5 rounded flex items-center gap-0.5">
              <span>전문</span>
              <i data-lucide="chevron-right" class="w-3 h-3"></i>
            </span>
          </div>
          <span class="text-slate-600 truncate block mt-0.5 text-[0.85em]">${haftarahRef}</span>
        </div>

        <div onclick="openBritModal()" class="bg-white p-2.5 rounded-lg border border-slate-200 hover:border-indigo-400 hover:bg-indigo-50/30 cursor-pointer transition-all shadow-sm group">
          <div class="flex items-center justify-between">
            <span class="font-bold text-indigo-950 block group-hover:text-indigo-900">브릿하다샤 (신약)</span>
            <span class="text-[0.7em] text-indigo-700 bg-indigo-50 font-semibold px-1.5 py-0.5 rounded flex items-center gap-0.5">
              <span>전문</span>
              <i data-lucide="chevron-right" class="w-3 h-3"></i>
            </span>
          </div>
          <span class="text-slate-600 truncate block mt-0.5 text-[0.85em]">${britRef}</span>
        </div>

        <div onclick="openStoryModal()" class="bg-white p-2.5 rounded-lg border border-slate-200 hover:border-amber-400 hover:bg-amber-50/40 cursor-pointer transition-all shadow-sm group">
          <div class="flex items-center justify-between">
            <span class="font-bold text-indigo-950 block group-hover:text-amber-900">이야기</span>
            <span class="text-[0.7em] text-amber-700 bg-amber-100 font-semibold px-1.5 py-0.5 rounded flex items-center gap-0.5">
              <span>전문</span>
              <i data-lucide="chevron-right" class="w-3 h-3"></i>
            </span>
          </div>
          <span class="text-slate-600 truncate block mt-0.5 text-[0.85em]">${storyPreview}</span>
        </div>
      `;

      // TAB 2: 핵심 강해 (M열)
      document.getElementById('exegesis-content').innerHTML = `
        <div class="border-l-4 border-indigo-700 pl-3 py-1 mb-3">
          <h3 class="font-bold text-indigo-950 text-[1.1em]">${data.title_ko || ''} 종합 강해</h3>
        </div>
        <div class="text-slate-700 leading-relaxed">${cleanText(data.exegesis) || '등록된 강해 내용이 없습니다.'}</div>
      `;

      // TAB 3: 상징 & 묵상 (N열)
      document.getElementById('symbols-content').innerHTML = `
        <div class="border-l-4 border-amber-500 pl-3 py-1 mb-3">
          <h3 class="font-bold text-amber-950 text-[1.1em]">${data.title_ko || ''} 주요 상징 및 절기 의미</h3>
        </div>
        <div class="text-slate-700 leading-relaxed">${cleanText(data.symbols) || '등록된 상징 정보가 없습니다.'}</div>
      `;

      // TAB 4: 원어 묵상 (O열)
      const rawDict = cleanText(data.dictionary_json || data.dictionary || '');
      const dictContainer = document.getElementById('dictionary-content');

      if (rawDict) {
        const hasHtml = /<[a-z][\s\S]*>/i.test(rawDict);
        const whitespaceClass = hasHtml ? '' : 'whitespace-pre-line';
        dictContainer.className = `bg-white border border-slate-200 rounded-2xl p-4 sm:p-5 shadow-sm text-[0.9em] leading-relaxed space-y-2 ${whitespaceClass}`;
        dictContainer.innerHTML = `
          <div class="border-l-4 border-indigo-700 pl-3 py-1 mb-3">
            <h3 class="font-bold text-indigo-950 text-[1.1em]">${data.title_ko || ''} 원어 심화 묵상</h3>
          </div>
          <div class="text-slate-700 leading-relaxed">${rawDict}</div>
        `;
      } else {
        dictContainer.className = "bg-white border border-slate-200 rounded-2xl p-4 sm:p-5 shadow-sm text-[0.9em] leading-relaxed text-center text-slate-400";
        dictContainer.innerHTML = '등록된 원어 묵상 내용이 없습니다.';
      }
      
      lucide.createIcons();
    }

    function updateDailyReadingView() {
      const data = currentWeekData;
      if (!data) return;

      document.querySelectorAll('.daily-tab-btn').forEach((btn, idx) => {
        if (idx === selectedDayIndex) {
          btn.className = 'daily-tab-btn py-2 rounded-xl text-[0.8em] font-bold border transition-all text-center bg-indigo-900 text-white border-indigo-900 shadow-sm';
        } else {
          btn.className = 'daily-tab-btn py-2 rounded-xl text-[0.8em] font-medium border transition-all text-center bg-white text-slate-600 border-slate-200 hover:bg-slate-50';
        }
      });

      const dayNum = selectedDayIndex + 1;
      const ref = data[`day${dayNum}_ref`] || (selectedDayIndex === 6 ? (data.torah_ref || '') : data.torah_ref || '');
      const rawText = data[`day${dayNum}_text`] || data.torah_text || '';
      const text = cleanText(rawText);
      const dayLabel = data[`day${dayNum}_day`] || ['일', '월', '화', '수', '목', '금', '토'][selectedDayIndex];

      // HTML 태그 포함 여부에 맞춰 미리보기 렌더링 (글꼴: Noto Sans KR 유지, 높이 제한 및 페이드아웃 효과)
      let previewHtml = '';
      if (!text) {
        previewHtml = '<p class="text-slate-400 text-[0.85em]">해당 요일의 본문 내용이 등록되어 있지 않습니다.</p>';
      } else if (/<[a-z][\s\S]*>/i.test(text)) {
        previewHtml = `
          <div class="text-[0.85em] max-h-36 overflow-hidden relative leading-relaxed text-slate-700" style="font-family: 'Noto Sans KR', sans-serif;">
            ${text}
            <div class="absolute bottom-0 left-0 right-0 h-10 bg-gradient-to-t from-white to-transparent pointer-events-none"></div>
          </div>
        `;
      } else {
        const plainPreview = text.length > 150 ? text.substring(0, 150) + '...' : text;
        previewHtml = `
          <p class="text-slate-600 text-[0.85em] line-clamp-3 leading-relaxed whitespace-pre-line" style="font-family: 'Noto Sans KR', sans-serif;">
            ${plainPreview}
          </p>
        `;
      }

      const card = document.getElementById('daily-reading-card');
      card.innerHTML = `
        <div class="bg-white p-4 rounded-xl border border-amber-200/90 shadow-sm space-y-3">
          <div class="flex items-center justify-between">
            <span class="text-[0.75em] font-bold text-indigo-700 bg-indigo-50 border border-indigo-200 px-2.5 py-0.5 rounded-full">
              ${DAY_NAMES[selectedDayIndex]} (${dayLabel}) • 토라 리딩
            </span>
            <button onclick="openDailyModal()" 
                    class="text-[0.75em] text-indigo-600 hover:text-indigo-800 font-bold flex items-center gap-1 bg-indigo-50/80 px-2 py-1 rounded-lg">
              <span>전문 읽기</span>
              <i data-lucide="maximize-2" class="w-3.5 h-3.5"></i>
            </button>
          </div>
          
          <div>
            <div class="text-[1.05em] font-bold text-slate-800 mb-1.5">${ref || '장절 정보 없음'}</div>
            ${previewHtml}
          </div>

          <button onclick="openDailyModal()" 
                  class="w-full bg-slate-100 hover:bg-indigo-50 text-indigo-900 border border-slate-200 hover:border-indigo-300 py-2.5 rounded-xl text-[0.8em] font-semibold flex items-center justify-center gap-1.5 transition-all">
            <i data-lucide="book-open" class="w-4 h-4 text-indigo-600"></i>
            <span>오늘의 본문 전문 열기</span>
          </button>
        </div>
      `;
      lucide.createIcons();
    }

    function selectReadingDay(dayIdx) {
      selectedDayIndex = dayIdx;
      updateDailyReadingView();
    }

    // 이전 주차/행 이동
    function prevWeek() {
      if (currentIndex > 1) {
        fetchWeekData({ index: currentIndex - 1 });
      }
    }

    // 다음 주차/행 이동
    function nextWeek() {
      if (currentIndex < totalCount) {
        fetchWeekData({ index: currentIndex + 1 });
      }
    }

    // 모달 제어 함수들
    function openDailyModal() {
      const data = currentWeekData;
      if (!data) return;

      const dayNum = selectedDayIndex + 1;
      const ref = data[`day${dayNum}_ref`] || (selectedDayIndex === 6 ? (data.torah_ref || '') : data.torah_ref || '');
      const rawText = data[`day${dayNum}_text`] || data.torah_text || '등록된 본문 내용이 없습니다.';

      document.getElementById('modal-category').innerText = `${DAY_NAMES[selectedDayIndex]} 본문`;
      document.getElementById('modal-title').innerText = ref || '성경 장절';
      
      setModalBody(rawText);
      document.getElementById('scripture-modal').classList.remove('hidden');
    }

    function openTorahModal() {
      const data = currentWeekData;
      if (!data) return;

      document.getElementById('modal-category').innerText = '주간 토라 (파라샤)';
      document.getElementById('modal-title').innerText = data.torah_ref || '토라 본문';
      setModalBody(data.torah_text || '등록된 토라 본문 내용이 없습니다.');
      document.getElementById('scripture-modal').classList.remove('hidden');
    }

    function openHaftarahModal() {
      const data = currentWeekData;
      if (!data) return;

      const ref = data.haftarah_ref || '하프타라';
      const text = data.haftarah_text || data.haftarah || `${ref} 본문입니다. 자세한 본문 내용은 성경책을 참고하시거나 시트에 등록해 주세요.`;

      document.getElementById('modal-category').innerText = '하프타라 (선지서)';
      document.getElementById('modal-title').innerText = ref;
      setModalBody(text);
      document.getElementById('scripture-modal').classList.remove('hidden');
    }

    function openBritModal() {
      const data = currentWeekData;
      if (!data) return;

      const ref = data.brit_ref || '브릿하다샤';
      const text = data.brit_text || data.brit || `${ref} 본문입니다. 시트의 K열(brit_text)에 내용을 등록해 주세요.`;

      document.getElementById('modal-category').innerText = '브릿하다샤 (신약)';
      document.getElementById('modal-title').innerText = ref;
      setModalBody(text);
      document.getElementById('scripture-modal').classList.remove('hidden');
    }

    function openStoryModal() {
      const data = currentWeekData;
      if (!data) return;

      const storyContent = data.special_ref || data.special_text || data.special || '등록된 이야기 내용이 없습니다.';

      document.getElementById('modal-category').innerText = '주간 이야기';
      document.getElementById('modal-title').innerText = `${data.title_ko || ''} 이야기`;
      setModalBody(storyContent);
      document.getElementById('scripture-modal').classList.remove('hidden');
    }

    function closeScriptureModal() {
      document.getElementById('scripture-modal').classList.add('hidden');
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.add('hidden'));
      document.getElementById('panel-' + tabId).classList.remove('hidden');

      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('bg-indigo-900', 'text-white');
        btn.classList.add('bg-slate-100', 'text-slate-600');
      });
      const activeBtn = document.getElementById('tab-' + tabId);
      if (activeBtn) {
        activeBtn.classList.add('bg-indigo-900', 'text-white');
        activeBtn.classList.remove('bg-slate-100', 'text-slate-600');
      }
    }

    // 글자 크기 조절
    let currentBaseSize = 16;
    document.getElementById('btn-font-inc').addEventListener('click', () => {
      if (currentBaseSize < 22) {
        currentBaseSize += 1;
        document.documentElement.style.setProperty('--app-base-size', currentBaseSize + 'px');
      }
    });
    document.getElementById('btn-font-dec').addEventListener('click', () => {
      if (currentBaseSize > 12) {
        currentBaseSize -= 1;
        document.documentElement.style.setProperty('--app-base-size', currentBaseSize + 'px');
      }
    });

    // 공유 기능
    async function sharePortion() {
      const titleText = document.getElementById('header-title') ? document.getElementById('header-title').innerText : '토라포션 365';
      const hebrewText = document.getElementById('header-hebrew') ? document.getElementById('header-hebrew').innerText : '';
      const dateInfo = document.getElementById('header-date') ? document.getElementById('header-date').innerText : '';
      const shareUrl = window.location.href;

      const shareData = {
        title: `${titleText} ${hebrewText}`,
        text: `[토라포션 365]\n${titleText} ${hebrewText}\n${dateInfo}\n말씀과 강해를 함께 나눕니다.`,
        url: shareUrl
      };

      if (navigator.share) {
        try {
          await navigator.share(shareData);
        } catch (err) {
          if (err.name !== 'AbortError') console.error('공유 오류:', err);
        }
      } else {
        try {
          await navigator.clipboard.writeText(shareUrl);
          alert('공유 링크가 클립보드에 복사되었습니다!\n원하는 곳에 붙여넣기 하세요.');
        } catch (clipErr) {
          prompt('아래 링크를 복사하여 공유하세요:', shareUrl);
        }
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
      selectedDayIndex = new Date().getDay(); // 오늘 요일 자동 선택
      
      // 접속한 당일(오늘) 날짜를 넘겨 현재 주차를 자동 판별하여 호출
      const todayStr = getTodayYMD();
      fetchWeekData({ today: todayStr });
    });
  </script>
</body>
</html>
