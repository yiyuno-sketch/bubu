<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>부부묵상 365</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&family=Frank+Ruhl+Libre:wght@500;700&display=swap');
    
    :root {
      --app-base-size: 14px;
    }

    body { 
      font-family: 'Noto Sans KR', sans-serif; 
      font-size: var(--app-base-size);
    }
    
    .scripture-font { font-family: 'Noto Serif KR', serif; line-height: 1.85; }
    .hebrew-text { font-family: 'Frank Ruhl Libre', serif; direction: rtl; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .dynamic-root {
      font-size: var(--app-base-size);
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 flex justify-center min-h-screen">

  <!-- 반응형 레이아웃: 모바일 100%, 태블릿/PC는 max-w-3xl 가독성 유지 -->
  <div class="dynamic-root w-full max-w-3xl bg-white min-h-screen flex flex-col shadow-xl relative">

    <!-- 상단 헤더 -->
    <header class="bg-indigo-950 text-white px-4 sm:px-6 py-3 sticky top-0 z-30 shadow-md">
      <div class="flex items-center justify-between mb-2">
        <div class="flex items-center space-x-2">
          <i data-lucide="book-open" class="w-5 h-5 text-amber-400"></i>
          <span class="text-[0.8em] tracking-wider text-indigo-200 font-medium">부부묵상 365</span>
        </div>
        <!-- 전체 글자 크기 조절 버튼 -->
       <div class="flex items-center space-x-1 bg-indigo-900/60 rounded-lg px-2 py-0.5 border border-indigo-700/50">
          <button id="btn-font-dec" class="text-[0.75em] text-indigo-300 hover:text-white px-1.5 py-0.5">가-</button>
          <span class="text-[0.7em] text-indigo-400">|</span>
          <button id="btn-font-inc" class="text-[0.75em] text-indigo-300 hover:text-white px-1.5 py-0.5 font-bold">가+</button>
      <!-- 새로 추가할 부분 시작 yiyuno 기능정지
          <span class="text-[0.7em] text-indigo-400">|</span>
          <button onclick="forceRefreshData()" title="최신 데이터 즉시 동기화" class="text-[0.8em] text-amber-300 hover:text-white px-1 active:scale-90 transition-all">🔄</button>
      새로 추가할 부분 끝 -->
        </div>
        
      <!-- 포션 선택 셀렉터 & 이전/다음 버튼 -->
      <div class="flex items-center justify-between bg-indigo-900/40 rounded-xl p-2 sm:p-3 border border-indigo-800/80">
        <button onclick="prevWeek()" class="p-1 hover:bg-indigo-800 rounded-lg text-indigo-300 active:scale-95 transition-all">
          <i data-lucide="chevron-left" class="w-5 h-5"></i>
        </button>
        <div class="text-center flex-1 px-2">
          <div id="header-date" class="text-[0.75em] text-amber-300 font-semibold tracking-wide">로딩 중...</div>
          <div class="flex items-center justify-center space-x-2">
            <h1 id="header-title" class="text-[1.1em] font-bold text-white">토라포션 불러오는 중</h1>
            <span id="header-hebrew" class="hebrew-text text-[1.2em] text-amber-200"></span>
          </div>
        </div>
        <button onclick="nextWeek()" class="p-1 hover:bg-indigo-800 rounded-lg text-indigo-300 active:scale-95 transition-all">
          <i data-lucide="chevron-right" class="w-5 h-5"></i>
        </button>
      </div>
    </header>

    <!-- 스크롤 탭 바 -->
    <nav class="bg-white border-b border-slate-200 sticky top-[108px] z-20 flex overflow-x-auto no-scrollbar px-3 sm:px-6 py-2 shadow-sm gap-2">
      <button onclick="switchTab('reading')" id="tab-reading" class="tab-btn active flex-shrink-0 px-4 py-1.5 rounded-full text-[0.85em] font-semibold transition-all bg-indigo-900 text-white">
        리딩 본문 (월~토)
      </button>
      <button onclick="switchTab('exegesis')" id="tab-exegesis" class="tab-btn flex-shrink-0 px-4 py-1.5 rounded-full text-[0.85em] font-semibold transition-all bg-slate-100 text-slate-600 hover:bg-slate-200">
        핵심 강해
      </button>
      <button onclick="switchTab('symbols')" id="tab-symbols" class="tab-btn flex-shrink-0 px-4 py-1.5 rounded-full text-[0.85em] font-semibold transition-all bg-slate-100 text-slate-600 hover:bg-slate-200">
        상징 & 묵상
      </button>
      <button onclick="switchTab('dictionary')" id="tab-dictionary" class="tab-btn flex-shrink-0 px-4 py-1.5 rounded-full text-[0.85em] font-semibold transition-all bg-slate-100 text-slate-600 hover:bg-slate-200">
        원어 사전
      </button>
    </nav>

    <!-- 메인 콘텐츠 영역 -->
    <main id="content-body" class="flex-1 p-4 sm:p-6 pb-28 overflow-y-auto space-y-4">

      <!-- ================= TAB 1: 리딩 본문 (월~토 6일) ================= -->
      <section id="panel-reading" class="tab-panel space-y-4">
        
        <div class="bg-amber-50/70 border border-amber-200/80 rounded-2xl p-4 sm:p-5">
          <div class="flex items-center justify-between text-amber-900 font-bold mb-3">
            <div class="flex items-center space-x-2">
              <i data-lucide="calendar" class="w-4 h-4 text-amber-600"></i>
              <span class="text-[0.95em]">이번 주 성경 읽기 (월~토 6일 리딩)</span>
            </div>
            <span class="text-[0.75em] font-normal text-amber-700 bg-amber-200/60 px-2 py-0.5 rounded-full">매일 읽기</span>
          </div>

          <!-- 월~토 요일 선택 탭 -->
          <div class="grid grid-cols-6 gap-1.5 sm:gap-2 mb-4">
            <button onclick="selectReadingDay(0)" class="daily-tab-btn py-2 rounded-xl text-[0.8em] font-semibold border transition-all text-center">월</button>
            <button onclick="selectReadingDay(1)" class="daily-tab-btn py-2 rounded-xl text-[0.8em] font-semibold border transition-all text-center">화</button>
            <button onclick="selectReadingDay(2)" class="daily-tab-btn py-2 rounded-xl text-[0.8em] font-semibold border transition-all text-center">수</button>
            <button onclick="selectReadingDay(3)" class="daily-tab-btn py-2 rounded-xl text-[0.8em] font-semibold border transition-all text-center">목</button>
            <button onclick="selectReadingDay(4)" class="daily-tab-btn py-2 rounded-xl text-[0.8em] font-semibold border transition-all text-center">금</button>
            <button onclick="selectReadingDay(5)" class="daily-tab-btn py-2 rounded-xl text-[0.8em] font-semibold border transition-all text-center">토</button>
          </div>

          <!-- 선택된 요일 카드 본문 영역 -->
          <div id="daily-reading-card" class="space-y-3">
            <div class="text-center py-6 text-slate-400 text-[0.85em]">데이터를 불러오고 있습니다...</div>
          </div>
        </div>

        <!-- 주간 전체 포션 요약 카드 -->
        <div class="bg-slate-50 border border-slate-200 rounded-2xl p-4">
          <div class="text-[0.8em] font-bold text-slate-600 mb-2 flex items-center gap-1.5">
            <i data-lucide="scroll" class="w-3.5 h-3.5 text-slate-500"></i>
            <span>주간 전체 성경 범위 요약</span>
          </div>
          <div id="weekly-overview-list" class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-[0.8em]">
          </div>
        </div>
      </section>

      <!-- ================= TAB 2: 핵심 강해 ================= -->
      <section id="panel-exegesis" class="tab-panel hidden space-y-3">
        <div id="exegesis-content" class="bg-white border border-slate-200 rounded-2xl p-4 sm:p-5 shadow-sm text-[0.9em] leading-relaxed space-y-2">
        </div>
      </section>

      <!-- ================= TAB 3: 상징 & 묵상 ================= -->
      <section id="panel-symbols" class="tab-panel hidden space-y-3">
        <div id="symbols-content" class="bg-white border border-slate-200 rounded-2xl p-4 sm:p-5 shadow-sm text-[0.9em] leading-relaxed space-y-2">
        </div>
      </section>

      <!-- ================= TAB 4: 원어 사전 ================= -->
      <section id="panel-dictionary" class="tab-panel hidden space-y-3">
        <div class="flex items-center justify-between pb-1 px-1">
          <span class="text-[0.85em] font-bold text-slate-500">주요 히브리어 원어 스트롱코드</span>
        </div>
        <div id="dictionary-list" class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
        </div>
      </section>

    </main>

    <!-- ================= 성경 전문 읽기 바텀시트 / 모달 ================= -->
    <div id="scripture-modal" class="fixed inset-0 z-50 bg-black/60 hidden flex flex-col justify-end items-center">
      <div class="flex-1 w-full" onclick="closeScriptureModal()"></div>
      <div class="bg-white w-full max-w-3xl rounded-t-3xl h-[85vh] flex flex-col shadow-2xl overflow-hidden animate-in slide-in-from-bottom duration-300">
        <div class="p-4 border-b border-slate-200 flex items-center justify-between bg-slate-50">
          <div>
            <span id="modal-category" class="text-[0.75em] font-bold text-indigo-700 bg-indigo-100 px-2 py-0.5 rounded-full">성경 본문</span>
            <h3 id="modal-title" class="font-bold text-slate-900 text-[1.05em] mt-1">성경 장절</h3>
          </div>
          <button onclick="closeScriptureModal()" class="p-2 hover:bg-slate-200 rounded-full text-slate-500">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>
        <div id="modal-content" class="flex-1 p-5 overflow-y-auto scripture-font text-slate-800 space-y-4 text-[0.95em] leading-relaxed whitespace-pre-line">
        </div>
        <div class="p-3 border-t border-slate-100 bg-slate-50 text-center">
          <button onclick="closeScriptureModal()" class="w-full bg-indigo-950 text-white font-semibold py-2.5 rounded-xl text-[0.85em] hover:bg-indigo-900 transition-all">
            본문 닫기 (읽기 완료)
          </button>
        </div>
      </div>
    </div>

    <!-- 하단 액션바 -->
    <footer class="bg-white/95 backdrop-blur-sm border-t border-slate-200 p-3 fixed bottom-0 left-0 right-0 max-w-3xl mx-auto flex items-center justify-between z-30 shadow-lg">
      <button class="flex items-center space-x-1.5 text-[0.8em] text-slate-600 hover:text-indigo-900 font-medium px-3 py-2 rounded-xl hover:bg-slate-100">
        <i data-lucide="bookmark" class="w-4 h-4"></i>
        <span>북마크</span>
      </button>
      <button class="flex items-center space-x-1.5 text-[0.8em] text-slate-600 hover:text-indigo-900 font-medium px-3 py-2 rounded-xl hover:bg-slate-100">
        <i data-lucide="edit-3" class="w-4 h-4"></i>
        <span>묵상 메모</span>
      </button>
      <button onclick="sharePortion()" class="bg-indigo-900 text-white text-[0.8em] font-semibold px-4 py-2 rounded-xl flex items-center space-x-1.5 shadow-sm active:scale-95 transition-all">
        <i data-lucide="share-2" class="w-4 h-4"></i>
        <span>포션 나눔</span>
      </button>
    </footer>

  </div>

  <script>
    const API_URL = "/api/torah";

    let torahDatabase = [];
    let currentWeekIndex = 0;
    let selectedDayIndex = 0; // 0:월, 1:화, 2:수, 3:목, 4:금, 5:토

    const DAY_NAMES = ["월요일 (1일차)", "화요일 (2일차)", "수요일 (3일차)", "목요일 (4일차)", "금요일 (5일차)", "토요일 (6일차)"];

// 스프레드시트 데이터 불러오기 (초고속 캐싱 적용 버전)
    async function loadTorahData() {
      // [1단계] 내 스마트폰 주머니(로컬 저장소)에 저장된 말씀이 있는지 먼저 확인
      const cachedData = localStorage.getItem("bubu365_torah_cache");
      
      if (cachedData) {
        try {
          torahDatabase = JSON.parse(cachedData);
          // 오늘 요일(월~토) 맞추기
          const today = new Date().getDay();
          selectedDayIndex = (today >= 1 && today <= 6) ? today - 1 : 0;
          // 구글 창고를 기다리지 않고 0.1초 만에 화면에 바로 띄웁니다!
          renderCurrentWeek();
        } catch (e) {
          console.error("캐시 데이터 읽기 실패:", e);
        }
      }

      // [2단계] 화면은 이미 떠 있는 상태에서, 뒤로 조용히 구글 창고에 가서 새 내용이 있는지 확인
      try {
        const response = await fetch(API_URL);
        const freshData = await response.json();

        if (freshData && freshData.length > 0) {
          torahDatabase = freshData;
          // 새로 받아온 따끈따끈한 말씀을 주머니에 갱신 저장
          localStorage.setItem("bubu365_torah_cache", JSON.stringify(freshData));
          
          const today = new Date().getDay();
          selectedDayIndex = (today >= 1 && today <= 6) ? today - 1 : 0;
          // 최신 내용으로 화면을 조용히 새로고침
          renderCurrentWeek();
        }
      } catch (error) {
        console.error("구글 데이터 동기화 실패:", error);
        // 만약 주머니에도 없고 구글 통신도 실패했다면 에러 표시
        if (!cachedData) {
          const card = document.getElementById('daily-reading-card');
          if (card) {
            card.innerHTML = '<div class="text-center py-4 text-red-500 text-[0.85em]">데이터를 가져오지 못했습니다. 네트워크를 확인해 주세요.</div>';
          }
        }
      }
    }   
    

    function renderCurrentWeek() {
      const data = torahDatabase[currentWeekIndex];
      if (!data) return;

      document.getElementById('header-date').innerText = `${data.date_info || ''} (${data.season || ''})`;
      document.getElementById('header-title').innerText = `[${data.week}주차] ${data.title_ko || ''}`;
      document.getElementById('header-hebrew').innerText = data.title_he || '';

      updateDailyReadingView();

      document.getElementById('weekly-overview-list').innerHTML = `
        <div class="bg-white p-2.5 rounded-lg border border-slate-200">
          <span class="font-bold text-indigo-950 block">토라 (파라샤)</span>
          <span class="text-slate-600">${data.torah_ref || '-'}</span>
        </div>
        <div class="bg-white p-2.5 rounded-lg border border-slate-200">
          <span class="font-bold text-indigo-950 block">하프타라 (선지서)</span>
          <span class="text-slate-600">${data.haftarah_ref || '-'}</span>
        </div>
        <div class="bg-white p-2.5 rounded-lg border border-slate-200">
          <span class="font-bold text-indigo-950 block">브릿하다샤 (신약)</span>
          <span class="text-slate-600">${data.brit_ref || '-'}</span>
        </div>
        <div class="bg-white p-2.5 rounded-lg border border-slate-200">
          <span class="font-bold text-indigo-950 block">특별 낭독 & 찬송</span>
          <span class="text-slate-600">${data.special_ref || '절기 찬송'}</span>
        </div>
      `;

      document.getElementById('exegesis-content').innerHTML = `
        <div class="border-l-4 border-indigo-700 pl-3 py-1 mb-3">
          <h3 class="font-bold text-indigo-950 text-[1.1em]">${data.title_ko} 종합 강해</h3>
        </div>
        <div class="text-slate-700 whitespace-pre-line leading-relaxed">${data.exegesis || '등록된 강해 내용이 없습니다.'}</div>
      `;

      document.getElementById('symbols-content').innerHTML = `
        <div class="border-l-4 border-amber-500 pl-3 py-1 mb-3">
          <h3 class="font-bold text-amber-950 text-[1.1em]">${data.title_ko} 주요 상징 및 절기 의미</h3>
        </div>
        <div class="text-slate-700 whitespace-pre-line leading-relaxed">${data.symbols || '등록된 상징 정보가 없습니다.'}</div>
      `;

      const dictList = document.getElementById('dictionary-list');
      if (Array.isArray(data.dictionary_json) && data.dictionary_json.length > 0) {
        dictList.innerHTML = data.dictionary_json.map(item => `
          <div class="bg-white border border-slate-200 rounded-xl p-3 flex justify-between items-center shadow-sm">
            <div>
              <div class="flex items-center space-x-2">
                <span class="text-[0.8em] font-bold text-indigo-700">${item.code || ''}</span>
                <span class="font-bold text-slate-800 text-[0.9em]">${item.pronounce || ''} (${item.word || ''})</span>
              </div>
              <div class="text-[0.8em] text-slate-500 mt-0.5">${item.meaning || ''}</div>
            </div>
            <span class="hebrew-text text-[1.3em] text-slate-700">${item.word || ''}</span>
          </div>
        `).join('');
      } else {
        dictList.innerHTML = '<div class="col-span-full text-center py-4 text-slate-400 text-[0.85em]">원어 사전 데이터가 없습니다.</div>';
      }

      lucide.createIcons();
    }

    // 요일별(월~토) 리딩 카드 렌더링
    function updateDailyReadingView() {
      const data = torahDatabase[currentWeekIndex];
      if (!data) return;

      document.querySelectorAll('.daily-tab-btn').forEach((btn, idx) => {
        if (idx === selectedDayIndex) {
          btn.className = 'daily-tab-btn py-2 rounded-xl text-[0.8em] font-bold border transition-all text-center bg-indigo-900 text-white border-indigo-900 shadow-sm';
        } else {
          btn.className = 'daily-tab-btn py-2 rounded-xl text-[0.8em] font-medium border transition-all text-center bg-white text-slate-600 border-slate-200 hover:bg-slate-50';
        }
      });

      // 새로 추가된 스프레드시트 컬럼 (day1_ref, day1_text ...) 직접 참조
      const dayNum = selectedDayIndex + 1;
      const ref = data[`day${dayNum}_ref`] || (selectedDayIndex === 5 ? (data.torah_ref || '') : data.torah_ref || '');
      const text = data[`day${dayNum}_text`] || data.torah_text || '';
      const dayLabel = data[`day${dayNum}_day`] || ['월', '화', '수', '목', '금', '토'][selectedDayIndex];

      const card = document.getElementById('daily-reading-card');
      card.innerHTML = `
        <div class="bg-white p-4 rounded-xl border border-amber-200/90 shadow-sm space-y-3">
          <div class="flex items-center justify-between">
            <span class="text-[0.75em] font-bold text-indigo-700 bg-indigo-50 border border-indigo-200 px-2.5 py-0.5 rounded-full">
              ${DAY_NAMES[selectedDayIndex]} (${dayLabel}) • 토라 리딩
            </span>
            <button onclick="openModal('${DAY_NAMES[selectedDayIndex]} 본문', '${escapeHtml(ref)}', '${escapeHtml(text)}')" 
                    class="text-[0.75em] text-indigo-600 hover:text-indigo-800 font-bold flex items-center gap-1 bg-indigo-50/80 px-2 py-1 rounded-lg">
              <span>전문 읽기</span>
              <i data-lucide="maximize-2" class="w-3.5 h-3.5"></i>
            </button>
          </div>
          
          <div>
            <div class="text-[1.05em] font-bold text-slate-800">${ref || '장절 정보 없음'}</div>
            <p class="text-slate-600 text-[0.85em] line-clamp-3 mt-1.5 scripture-font leading-relaxed">
              ${text ? text.substring(0, 150) + '...' : '해당 요일의 본문 내용이 등록되어 있지 않습니다. 스프레드시트의 day' + dayNum + '_text 열을 확인해 주세요.'}
            </p>
          </div>

          <button onclick="openModal('${DAY_NAMES[selectedDayIndex]} 본문', '${escapeHtml(ref)}', '${escapeHtml(text)}')" 
                  class="w-full bg-slate-100 hover:bg-indigo-50 text-indigo-900 border border-slate-200 hover:border-indigo-300 py-2.5 rounded-xl text-[0.8em] font-semibold flex items-center justify-center gap-1.5 transition-all">
            <i data-lucide="book-open" class="w-4 h-4 text-indigo-600"></i>
            <span>오늘의 본문 전문 열기</span>
          </button>
        </div>
      `;
      lucide.createIcons();
    }

    function selectReadingDay(dayIdx) {
      selectedDayIndex = dayIdx;
      updateDailyReadingView();
    }

    function prevWeek() {
      if (currentWeekIndex > 0) {
        currentWeekIndex--;
        renderCurrentWeek();
      }
    }
    function nextWeek() {
      if (currentWeekIndex < torahDatabase.length - 1) {
        currentWeekIndex++;
        renderCurrentWeek();
      }
    }

    function openModal(category, title, text) {
      document.getElementById('modal-category').innerText = category;
      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal-content').innerText = text || '등록된 본문 내용이 없습니다.';
      document.getElementById('scripture-modal').classList.remove('hidden');
    }
    function closeScriptureModal() {
      document.getElementById('scripture-modal').classList.add('hidden');
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.add('hidden'));
      document.getElementById('panel-' + tabId).classList.remove('hidden');

      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('bg-indigo-900', 'text-white');
        btn.classList.add('bg-slate-100', 'text-slate-600');
      });
      const activeBtn = document.getElementById('tab-' + tabId);
      if (activeBtn) {
        activeBtn.classList.add('bg-indigo-900', 'text-white');
        activeBtn.classList.remove('bg-slate-100', 'text-slate-600');
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/\n/g, '\\n');
    }

    // 전체 글자 크기 조절
    let currentBaseSize = 14;
    document.getElementById('btn-font-inc').addEventListener('click', () => {
      if (currentBaseSize < 20) {
        currentBaseSize += 1;
        document.documentElement.style.setProperty('--app-base-size', currentBaseSize + 'px');
      }
    });
    document.getElementById('btn-font-dec').addEventListener('click', () => {
      if (currentBaseSize > 11) {
        currentBaseSize -= 1;
        document.documentElement.style.setProperty('--app-base-size', currentBaseSize + 'px');
      }
    });

    
    // 공유 기능 (Web Share API)
    async function sharePortion() {
      const titleText = document.getElementById('header-title') ? document.getElementById('header-title').innerText : '토라포션 365';
      const hebrewText = document.getElementById('header-hebrew') ? document.getElementById('header-hebrew').innerText : '';
      const dateInfo = document.getElementById('header-date') ? document.getElementById('header-date').innerText : '';
      const shareUrl = window.location.href;

      const shareData = {
        title: `${titleText} ${hebrewText}`,
        text: `[토라포션 365]\n${titleText} ${hebrewText}\n${dateInfo}\n말씀과 강해를 함께 나눕니다.`,
        url: shareUrl
      };

      if (navigator.share) {
        try {
          await navigator.share(shareData);
        } catch (err) {
          if (err.name !== 'AbortError') console.error('공유 오류:', err);
        }
      } else {
        try {
          await navigator.clipboard.writeText(shareUrl);
          alert('공유 링크가 클립보드에 복사되었습니다!\n원하는 곳에 붙여넣기 하세요.');
        } catch (clipErr) {
          prompt('아래 링크를 복사하여 공유하세요:', shareUrl);
        }
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
      loadTorahData();
    });
  </script>
</body>
